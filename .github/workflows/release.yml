name: Build & Release

# Push a tag like v1.0.1 (or run manually) to build the Windows installer + Microsoft Store package
# and publish them as a GitHub Release. studio.btspl.tech/updates/ redirects to the latest release,
# so installed copies auto-update from there.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create and publish (e.g. v1.9.0); empty = build only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch FFmpeg (Windows x64)
        run: node scripts/fetch-ffmpeg.js

      - uses: microsoft/setup-msbuild@v2

      - name: Build native helpers (virtual camera, audio/ASIO/VST3, DeckLink keyer)
        shell: pwsh
        run: ./native/build-all.ps1

      - name: Build installer (NSIS)
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Build Microsoft Store package (APPX, identity from Partner Center)
        run: npx electron-builder --win appx --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: bts-studio-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/*.appx

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $tag = if ('${{ github.event.inputs.tag }}') { '${{ github.event.inputs.tag }}' } else { '${{ github.ref_name }}' }
          $ver = $tag.TrimStart('v')
          $md = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($md, "(?ms)^## $([regex]::Escape($ver))[^\n]*\n(.*?)(?=^## |\z)")
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { '' }
          $body += "`n`n**Download:** BTS-Studio-Setup-$ver.exe below (Windows 10/11 64-bit). Installed copies update automatically."
          Set-Content -Path release-notes.md -Value $body -Encoding utf8

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: BTS Studio ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          make_latest: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/*.appx
